name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Decode Release Keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      if: env.RELEASE_KEYSTORE_BASE64 != ''
      run: |
        echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks

    - name: Build Release APK
      env:
        RELEASE_KEYSTORE_PATH: release.jks
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Compute SHA-256 Checksum
      run: |
        cd app/build/outputs/apk/release/
        sha256sum app-release.apk > app-release.apk.sha256
        cat app-release.apk.sha256

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: deepseek-widget-release
        path: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/release/app-release.apk.sha256

    - name: Publish GitHub Release (on tag or main)
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="${GITHUB_REF_NAME}"
        if [ "$TAG_NAME" = "main" ]; then
          TAG_NAME="latest"
          TITLE="DeepSeek Balance Widget (Latest Rolling)"
        else
          TITLE="DeepSeek Balance Widget ${TAG_NAME}"
        fi

        # 提取 CHANGELOG 说明
        awk -v ver="${TAG_NAME#v}" '/^## \[/ { if (p) exit; if ($0 ~ ver) p=1; next } p' CHANGELOG.md > release_notes.txt
        if [ ! -s release_notes.txt ]; then
          cat CHANGELOG.md > release_notes.txt
        fi

        gh release view "$TAG_NAME" >/dev/null 2>&1 && EXISTS=1 || EXISTS=0
        if [ "$EXISTS" -eq 1 ]; then
          gh release edit "$TAG_NAME" --title "$TITLE" --notes-file release_notes.txt
          gh release upload "$TAG_NAME" app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release.apk.sha256 --clobber
        else
          gh release create "$TAG_NAME" app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release.apk.sha256 \
            --title "$TITLE" \
            --notes-file release_notes.txt \
            --verify-tag=false
        fi
